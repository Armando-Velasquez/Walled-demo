name: Deploy Wallet REST API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: wallet-rest-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and verify API
        run: |
          npm ci
          npm run check --workspace api

      - name: Package release
        run: |
          tar -czf wallet-rest.tar.gz \
            api \
            database \
            mobile/package.json \
            package.json \
            package-lock.json

      - name: Build production environment
        env:
          DB_HOST: ${{ vars.DB_HOST || '127.0.0.1' }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          DB_NAME: ${{ vars.DB_NAME || 'wallet_prod' }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSW }}
          ADMIN_DISPLAY_NAME: ${{ vars.ADMIN_DISPLAY_NAME || 'Administrador' }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          SMTP_SERVICE: ${{ vars.SMTP_SERVICE || 'gmail' }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM || vars.SMTP_USER }}
          EMAIL_TOKEN_SECRET: ${{ secrets.EMAIL_TOKEN_SECRET }}
        run: |
          for required in DB_USER DB_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD ADMIN_PIN SMTP_USER SMTP_PASS EMAIL_TOKEN_SECRET; do
            if [ -z "${!required}" ]; then
              echo "::error::Falta configurar ${required} en el environment production de GitHub."
              exit 1
            fi
          done

          if ! [[ "$ADMIN_PIN" =~ ^[0-9]{6}$ ]]; then
            echo "::error::ADMIN_PIN debe contener exactamente 6 dígitos."
            exit 1
          fi

          umask 077
          quote_env() {
            node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$1"
          }
          {
            printf 'NODE_ENV=production\n'
            printf 'PORT=4100\n'
            printf 'DB_HOST=%s\n' "$(quote_env "$DB_HOST")"
            printf 'DB_PORT=%s\n' "$(quote_env "$DB_PORT")"
            printf 'DB_NAME=%s\n' "$(quote_env "$DB_NAME")"
            printf 'DB_USER=%s\n' "$(quote_env "$DB_USER")"
            printf 'DB_PASSWORD=%s\n' "$(quote_env "$DB_PASSWORD")"
            printf 'ADMIN_DISPLAY_NAME=%s\n' "$(quote_env "$ADMIN_DISPLAY_NAME")"
            printf 'ADMIN_EMAIL=%s\n' "$(quote_env "$ADMIN_EMAIL")"
            printf 'ADMIN_PASSWORD=%s\n' "$(quote_env "$ADMIN_PASSWORD")"
            printf 'ADMIN_PIN=%s\n' "$(quote_env "$ADMIN_PIN")"
            printf 'MAIL_MODE=smtp\n'
            printf 'SMTP_SERVICE=%s\n' "$(quote_env "$SMTP_SERVICE")"
            printf 'SMTP_HOST=%s\n' "$(quote_env "$SMTP_HOST")"
            printf 'SMTP_PORT=%s\n' "$(quote_env "$SMTP_PORT")"
            printf 'SMTP_SECURE=%s\n' "$(quote_env "$SMTP_SECURE")"
            printf 'SMTP_USER=%s\n' "$(quote_env "$SMTP_USER")"
            printf 'SMTP_PASS=%s\n' "$(quote_env "$SMTP_PASS")"
            printf 'MAIL_FROM=%s\n' "$(quote_env "$MAIL_FROM")"
            printf 'EMAIL_TOKEN_SECRET=%s\n' "$(quote_env "$EMAIL_TOKEN_SECRET")"
          } > wallet-rest.env

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Wait for SSH connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Comprobando SSH (intento ${attempt}/5)..."
            if timeout 15 bash -c "</dev/tcp/${SERVER_HOST}/22"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::El VPS no acepta conexiones SSH desde este runner."
          exit 1

      - name: Upload release
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            wallet-rest.tar.gz wallet-rest.env \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/

      - name: Install and start Wallet API
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euo pipefail

          APP_DIR=/var/www/WALLET
          SERVICE_NAME=wallet-rest.service
          NGINX_SITE=/etc/nginx/sites-available/wallet-rest.armandovelasquez.com

          sudo mkdir -p "$APP_DIR"
          sudo systemctl stop "$SERVICE_NAME" 2>/dev/null || true
          sudo tar -xzf /tmp/wallet-rest.tar.gz -C "$APP_DIR"
          sudo install -m 600 /tmp/wallet-rest.env "$APP_DIR/api/.env"
          rm -f /tmp/wallet-rest.tar.gz /tmp/wallet-rest.env

          cd "$APP_DIR"
          sudo env NODE_ENV=production /usr/bin/npm ci --omit=dev --workspace api
          sudo /usr/bin/npm run db:init:production --workspace api
          sudo sed -i '/^ADMIN_PASSWORD=/d; /^ADMIN_PIN=/d' "$APP_DIR/api/.env"

          sudo tee /etc/systemd/system/$SERVICE_NAME >/dev/null << 'SYSTEMD'
          [Unit]
          Description=Wallet REST API
          Wants=network-online.target
          After=network-online.target mariadb.service mysql.service

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/var/www/WALLET/api
          EnvironmentFile=/var/www/WALLET/api/.env
          ExecStart=/usr/bin/node /var/www/WALLET/api/src/server.js
          Restart=always
          RestartSec=5
          StandardOutput=append:/var/www/WALLET/backend.log
          StandardError=append:/var/www/WALLET/backend-error.log

          [Install]
          WantedBy=multi-user.target
          SYSTEMD

          if [ ! -f "$NGINX_SITE" ]; then
            sudo tee "$NGINX_SITE" >/dev/null << 'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name wallet-rest.armandovelasquez.com;

              location / {
                  proxy_pass http://127.0.0.1:4100;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX
          else
            echo "Se conserva la configuración Nginx existente (incluido Certbot)."
          fi
          sudo ln -sfn "$NGINX_SITE" /etc/nginx/sites-enabled/wallet-rest.armandovelasquez.com

          sudo nginx -t
          sudo systemctl reload nginx
          sudo systemctl daemon-reload
          sudo systemctl enable "$SERVICE_NAME"
          sudo systemctl restart "$SERVICE_NAME"

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent http://127.0.0.1:4100/health >/dev/null; then
              echo "Wallet REST API desplegada correctamente."
              exit 0
            fi
            sleep 3
          done

          echo "La API no superó la comprobación de salud."
          sudo systemctl status "$SERVICE_NAME" --no-pager || true
          sudo journalctl -u "$SERVICE_NAME" -n 80 --no-pager || true
          exit 1
          EOF

# Después del primer deploy y con el DNS apuntando al VPS:
# sudo certbot --nginx -d wallet-rest.armandovelasquez.com
