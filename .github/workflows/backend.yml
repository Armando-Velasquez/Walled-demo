# Automatización con deploy de GitHub

# // Generar key SSH
# ssh-keygen -t rsa -b 4096 -C "correo@ejemplo.com"

# // Copiar la key pública al servidor
# ssh-copy-id -i ~/.ssh/id_rsa.pub root@IP_DEL_SERVIDOR

# // Ver key pública
# cat ~/.ssh/id_rsa.pub

# // Ver key privada para SSH_PRIVATE_KEY
# cat ~/.ssh/id_rsa

name: Deploy Wallet REST API

on:
  push:
    paths:
      - "api/**"
      - "database/**"
      - ".github/workflows/backend.yml"
    branches:
      - main # Rama de despliegue
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      # La API no necesita compilarse: se valida en el runner antes de copiarla.
      - name: Check backend
        working-directory: api
        run: |
          npm ci
          npm run check

      # En el VPS la API queda directamente en:
      # /var/www/PRIVATE/WALLET/backend
      - name: Package release
        run: |
          mkdir -p release/backend release/database
          cp -R api/src api/scripts release/backend/
          cp api/package.json api/package-lock.json release/backend/
          cp database/schema.sql database/production-seed.sql release/database/
          tar -czf wallet-backend.tar.gz -C release backend database

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # GitHub usa IPs efímeras. Se comprueba el puerto antes de copiar
      # archivos o escribir secretos en el servidor.
      - name: Wait for SSH connectivity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Comprobando SSH (intento ${attempt}/5)..."
            if timeout 15 bash -c "</dev/tcp/${SERVER_HOST}/22"; then
              echo "El puerto SSH está accesible."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::El VPS no acepta conexiones TCP desde este runner en el puerto 22."
          exit 1

      # Generar archivo .env directamente en el servidor desde vars y secrets.
      # Los valores no sensibles siguen como vars y las claves como secrets,
      # igual que en los demás proyectos.
      - name: Generate .env file on server
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=3 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'

          mkdir -p /var/www/PRIVATE/WALLET/backend

          echo "NODE_ENV=production" > /var/www/PRIVATE/WALLET/backend/.env
          echo "PORT=${{ vars.PORT || '3100' }}" >> /var/www/PRIVATE/WALLET/backend/.env

          echo "DB_HOST=${{ vars.DB_HOST }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "DB_PORT=${{ vars.DB_PORT }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "DB_NAME=${{ vars.DB_NAME }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "DB_USER=${{ vars.DB_USER }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "DB_PASSWORD=${{ secrets.DB_PASSW }}" >> /var/www/PRIVATE/WALLET/backend/.env

          echo "ADMIN_DISPLAY_NAME=${{ vars.ADMIN_DISPLAY_NAME }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "ADMIN_PIN=${{ secrets.ADMIN_PIN }}" >> /var/www/PRIVATE/WALLET/backend/.env

          echo "MAIL_MODE=smtp" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_SERVICE=${{ vars.SMTP_SERVICE || 'gmail' }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_HOST=${{ vars.SMTP_HOST }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_PORT=${{ vars.SMTP_PORT || '587' }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_SECURE=${{ vars.SMTP_SECURE || 'false' }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_USER=${{ vars.SMTP_USER }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "MAIL_FROM=${{ vars.MAIL_FROM }}" >> /var/www/PRIVATE/WALLET/backend/.env
          echo "EMAIL_TOKEN_SECRET=${{ secrets.EMAIL_TOKEN_SECRET }}" >> /var/www/PRIVATE/WALLET/backend/.env

          chmod 600 /var/www/PRIVATE/WALLET/backend/.env
          EOF

      # Copia el backend validado en el runner. En el VPS solo se instalan
      # dependencias de producción y se reinicia el servicio.
      - name: Deploy Backend
        run: |
          echo "Copiando el paquete al servidor..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=3 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p /var/www/PRIVATE/WALLET"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=3 wallet-backend.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/wallet-backend.tar.gz

          echo "Instalando dependencias de producción y arrancando..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ConnectionAttempts=3 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e

          PROJECT_DIR=/var/www/PRIVATE/WALLET
          BACKEND_DIR=$PROJECT_DIR/backend
          SERVICE_FILE=/etc/systemd/system/wallet-rest.service
          NGINX_SITE=/etc/nginx/sites-available/wallet-rest.armandovelasquez.com
          NGINX_UPSTREAM=/etc/nginx/snippets/wallet-rest-upstream.conf
          APP_PORT=${{ vars.PORT || '3100' }}

          sudo mkdir -p "$BACKEND_DIR" "$PROJECT_DIR/logs" /etc/nginx/snippets
          sudo systemctl stop wallet-rest.service || true
          sudo tar -xzf /tmp/wallet-backend.tar.gz -C "$PROJECT_DIR"
          rm -f /tmp/wallet-backend.tar.gz

          cd "$BACKEND_DIR"
          unset NODE_ENV
          npm ci --omit=dev
          npm run db:init:production
          sed -i '/^ADMIN_PASSWORD=/d; /^ADMIN_PIN=/d' "$BACKEND_DIR/.env"

          # Configurar servicio Systemd. Se actualiza en cada deploy para que
          # las rutas siempre coincidan con la ubicación privada del proyecto.
          sudo tee "$SERVICE_FILE" >/dev/null << 'SYSTEMD'
          [Unit]
          Description=Wallet REST API
          Wants=network-online.target
          After=network-online.target mariadb.service mysql.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/node /var/www/PRIVATE/WALLET/backend/src/server.js
          WorkingDirectory=/var/www/PRIVATE/WALLET/backend
          StandardOutput=append:/var/www/PRIVATE/WALLET/logs/backend.log
          StandardError=append:/var/www/PRIVATE/WALLET/logs/backend-error.log
          Restart=always
          RestartSec=5
          User=root
          Group=root
          EnvironmentFile=/var/www/PRIVATE/WALLET/backend/.env
          Environment=NODE_ENV=production

          [Install]
          WantedBy=multi-user.target
          SYSTEMD

          # El puerto del upstream se actualiza desde vars.PORT. Nginx conserva
          # el sitio HTTPS modificado posteriormente por Certbot.
          printf 'proxy_pass http://127.0.0.1:%s;\n' "$APP_PORT" | sudo tee "$NGINX_UPSTREAM" >/dev/null

          if [ ! -f "$NGINX_SITE" ]; then
            sudo tee "$NGINX_SITE" >/dev/null << 'NGINX_CONF'
          server {
              listen 80;
              listen [::]:80;
              server_name wallet-rest.armandovelasquez.com;

              location / {
                  include /etc/nginx/snippets/wallet-rest-upstream.conf;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NGINX_CONF
          else
            echo "El sitio ya existe; se conserva la configuración HTTPS administrada por Certbot."
            if ! grep -q 'wallet-rest-upstream.conf' "$NGINX_SITE"; then
              sudo sed -i -E 's#proxy_pass http://127\.0\.0\.1:[0-9]+;#include /etc/nginx/snippets/wallet-rest-upstream.conf;#' "$NGINX_SITE"
            fi
          fi

          sudo ln -sfn "$NGINX_SITE" /etc/nginx/sites-enabled/wallet-rest.armandovelasquez.com
          sudo nginx -t
          sudo systemctl reload nginx

          sudo systemctl daemon-reload
          sudo systemctl enable wallet-rest.service
          sudo systemctl start wallet-rest.service

          sleep 3
          if ! sudo systemctl is-active --quiet wallet-rest.service; then
            echo "El servicio wallet-rest no quedó activo."
            sudo journalctl -u wallet-rest.service -n 80 --no-pager
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health" >/dev/null; then
              echo "Wallet REST API se ha iniciado correctamente."
              exit 0
            fi
            sleep 3
          done

          echo "La API no respondió correctamente."
          sudo journalctl -u wallet-rest.service -n 80 --no-pager
          exit 1
          EOF

